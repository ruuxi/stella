name: Build Desktop Release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. 0.0.1)"
        required: true
        default: "0.0.1"

permissions:
  contents: write

jobs:
  resolve-stella-browser:
    # Ship ordering: Build Stella Browser must publish current.json first.
    # Desktop releases intentionally fail here rather than package no binary or
    # mix mutable browser versions across matrix/publish jobs.
    runs-on: ubuntu-latest
    outputs:
      source-sha: ${{ steps.pin.outputs.source_sha }}
    steps:
      - name: Resolve immutable Stella Browser manifest
        id: pin
        env:
          R2_PUBLIC_BASE_URL: https://pub-a319aaada8144dc9be5a83625033769c.r2.dev
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-pins
          current_manifest="$(mktemp)"
          curl --fail --show-error --silent \
            "${R2_PUBLIC_BASE_URL%/}/stella-browser/current.json" \
            --output "$current_manifest"
          source_sha="$(node -e '
            const manifest = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            const sha = String(manifest.sourceSha || "").trim();
            if (!/^[0-9a-f]{40,64}$/i.test(sha)) throw new Error("Invalid Stella Browser sourceSha");
            process.stdout.write(sha);
          ' "$current_manifest")"
          immutable_url="${R2_PUBLIC_BASE_URL%/}/stella-browser/${source_sha}/manifest.json"
          curl --fail --show-error --silent \
            "$immutable_url" \
            --output release-pins/stella-browser-manifest.json
          node - "$source_sha" release-pins/stella-browser-manifest.json <<'NODE'
          const { readFileSync } = require("node:fs");
          const [expectedSha, manifestPath] = process.argv.slice(2);
          const manifest = JSON.parse(readFileSync(manifestPath, "utf8"));
          if (manifest.sourceSha !== expectedSha) {
            throw new Error(`Immutable Stella Browser manifest mismatch: expected ${expectedSha}, got ${manifest.sourceSha}`);
          }
          NODE
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: release-pin-stella-browser
          path: release-pins/stella-browser-manifest.json
          retention-days: 7

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: resolve-stella-browser
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: release-pin-stella-browser
          path: release-pins

      - name: Verify release commit is public master
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          test "$(git rev-parse "$GITHUB_SHA^{commit}")" = "$(git rev-parse origin/master)"

      - name: Publish desktop release manifest to R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_PUBLIC_BASE_URL: https://pub-a319aaada8144dc9be5a83625033769c.r2.dev
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          release_dir="desktop/releases/${tag}"
          mkdir -p release-assets
          manifest_path="$(mktemp)"
          native_helpers_manifest_path="$(mktemp)"
          stella_browser_manifest_path="release-pins/stella-browser-manifest.json"
          curl --fail --show-error --silent \
            "${R2_PUBLIC_BASE_URL%/}/native-helpers/current.json" \
            --output "$native_helpers_manifest_path"

          node - "$manifest_path" "$tag" "$GITHUB_SHA" "$R2_PUBLIC_BASE_URL" "$native_helpers_manifest_path" "$stella_browser_manifest_path" "${{ needs.resolve-stella-browser.outputs.source-sha }}" <<'NODE'
          const { readFileSync, writeFileSync } = require("node:fs");

          const [manifestPath, tag, commit, publicBaseUrl, nativeHelpersManifestPath, stellaBrowserManifestPath, expectedBrowserSourceSha] = process.argv.slice(2);
          const nativeHelpersManifest = JSON.parse(readFileSync(nativeHelpersManifestPath, "utf8"));
          const stellaBrowserManifest = JSON.parse(readFileSync(stellaBrowserManifestPath, "utf8"));
          if (stellaBrowserManifest.sourceSha !== expectedBrowserSourceSha) throw new Error("Pinned Stella Browser manifest sourceSha changed");
          const artifactForPlatform = (platform) => {
            const asset = nativeHelpersManifest.assets?.[platform];
            if (!asset) {
              throw new Error(`Missing native helper artifact for ${platform}`);
            }
            const helperSha = String(nativeHelpersManifest.sha || "").trim();
            return {
              kind: "native-helpers",
              platform,
              manifestUrl: `${publicBaseUrl.replace(/\/$/, "")}/native-helpers/${helperSha}/manifest.json`,
              ...(helperSha ? { manifestSha: helperSha } : {}),
              ...(nativeHelpersManifest.commit ? { commit: nativeHelpersManifest.commit } : {}),
              ...(nativeHelpersManifest.builtAt ? { builtAt: nativeHelpersManifest.builtAt } : {}),
              asset: {
                url: asset.url,
                sha256: `sha256:${String(asset.sha256).replace(/^sha256:/, "")}`,
                sizeBytes: asset.size,
              },
            };
          };
          const browserArtifactForPlatform = (platform) => {
            const asset = stellaBrowserManifest.assets?.[platform];
            if (!asset) {
              throw new Error(`Missing Stella Browser artifact for ${platform}`);
            }
            return {
              kind: "stella-browser",
              platform,
              asset: {
                url: asset.url,
                sha256: `sha256:${String(asset.sha256).replace(/^sha256:/, "")}`,
                sizeBytes: asset.size,
              },
            };
          };
          const platforms = {};
          for (const platform of ["win-x64", "darwin-arm64", "darwin-x64"]) {
            platforms[platform] = {
              artifactRefs: [artifactForPlatform(platform), browserArtifactForPlatform(platform)],
            };
          }
          writeFileSync(
            manifestPath,
            `${JSON.stringify({
              schemaVersion: 2,
              tag,
              commit,
              platforms,
              publishedAt: new Date().toISOString(),
            }, null, 2)}\n`,
          );
          NODE
          cp "$manifest_path" release-assets/stella-desktop-manifest.json

          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION="auto"

          aws s3 cp "$manifest_path" "s3://${R2_BUCKET}/${release_dir}/manifest.json" \
            --content-type "application/json" \
            --cache-control "public, max-age=31536000, immutable" \
            --endpoint-url "$R2_ENDPOINT"

          aws s3 cp "$manifest_path" "s3://${R2_BUCKET}/desktop/current.json" \
            --content-type "application/json" \
            --cache-control "no-cache" \
            --endpoint-url "$R2_ENDPOINT"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"

          shopt -s nullglob
          files=(release-assets/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No release assets found"
            exit 1
          fi

          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" "${files[@]}" \
              --title "$tag" \
              --generate-notes
          else
            gh release upload "$tag" "${files[@]}" --clobber
          fi

      - name: Notify Convex of new desktop release
        env:
          CONVEX_SITE_URL: ${{ secrets.CONVEX_SITE_URL }}
          DESKTOP_RELEASE_PUBLISH_SECRET: ${{ secrets.DESKTOP_RELEASE_PUBLISH_SECRET }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${CONVEX_SITE_URL:-}" ] || [ -z "${DESKTOP_RELEASE_PUBLISH_SECRET:-}" ]; then
            echo "CONVEX_SITE_URL or DESKTOP_RELEASE_PUBLISH_SECRET is not set; skipping Convex notify."
            exit 0
          fi

          curl --fail-with-body --show-error --silent \
            -X POST "${CONVEX_SITE_URL%/}/api/desktop-releases/publish" \
            -H "Authorization: Bearer ${DESKTOP_RELEASE_PUBLISH_SECRET}" \
            -H "Content-Type: application/json" \
            --data-binary "@release-assets/stella-desktop-manifest.json"
