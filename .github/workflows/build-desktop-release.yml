name: Build Desktop Release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. 0.0.1)"
        required: true
        default: "0.0.1"

permissions:
  contents: write

jobs:
  native-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            desktop/native
            desktop/scripts
          fetch-depth: 1

      - name: Install Rust + macOS targets
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build universal native helpers (macOS)
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.0"
        working-directory: desktop/native
        run: bash build.sh

      - name: Split universal binaries into per-arch tarballs
        shell: bash
        run: |
          set -euo pipefail
          OUT="desktop/native/out/darwin"
          if [ ! -d "$OUT" ]; then
            echo "expected $OUT to exist after build" >&2
            exit 1
          fi

          stage_arch() {
            local arch_label="$1"
            local stage_dir="$2"
            mkdir -p "$stage_dir"
            for entry in "$OUT"/*; do
              local name
              name="$(basename "$entry")"
              if [ -d "$entry" ]; then
                cp -R "$entry" "$stage_dir/$name"
                continue
              fi
              if [ "$name" = "parakeet_transcriber" ]; then
                if [ "$arch_label" = "arm64" ]; then
                  cp "$entry" "$stage_dir/$name"
                  chmod +x "$stage_dir/$name"
                fi
                continue
              fi
              if file "$entry" | grep -q "Mach-O"; then
                if lipo -info "$entry" >/dev/null 2>&1; then
                  if lipo -info "$entry" | grep -q "$arch_label"; then
                    lipo -thin "$arch_label" "$entry" -output "$stage_dir/$name"
                    chmod +x "$stage_dir/$name"
                    continue
                  fi
                fi
              fi
              cp "$entry" "$stage_dir/$name"
              chmod +x "$stage_dir/$name" 2>/dev/null || true
            done
          }

          stage_arch arm64 stage-darwin-arm64
          stage_arch x86_64 stage-darwin-x64

          tar --zstd -cf stella-native-darwin-arm64.tar.zst -C stage-darwin-arm64 .
          tar --zstd -cf stella-native-darwin-x64.tar.zst -C stage-darwin-x64 .

      - name: Upload macOS arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: stella-native-darwin-arm64
          path: stella-native-darwin-arm64.tar.zst
          retention-days: 30

      - name: Upload macOS x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: stella-native-darwin-x64
          path: stella-native-darwin-x64.tar.zst
          retention-days: 30

  native-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            desktop/native
          fetch-depth: 1

      - name: Install Rust + Windows MSVC target
        shell: pwsh
        run: rustup target add x86_64-pc-windows-msvc

      - name: Disable Windows Defender protections
        shell: pwsh
        run: |
          $opts = @{
            DisableRealtimeMonitoring  = $true
            DisableBehaviorMonitoring  = $true
            DisableBlockAtFirstSeen    = $true
            DisableIOAVProtection      = $true
            DisableScriptScanning      = $true
            DisableArchiveScanning     = $true
            DisableEmailScanning       = $true
            DisableRemovableDriveScanning = $true
            DisableIntrusionPreventionSystem = $true
            EnableControlledFolderAccess = "Disabled"
            EnableNetworkProtection    = "Disabled"
            MAPSReporting              = "Disabled"
            SubmitSamplesConsent       = "NeverSend"
          }
          foreach ($key in $opts.Keys) {
            try {
              Set-MpPreference -Force @{ $key = $opts[$key] }
            } catch {
            }
          }
          try {
            Set-MpPreference -DisableRealtimeMonitoring $true `
                             -DisableBehaviorMonitoring $true `
                             -DisableBlockAtFirstSeen $true `
                             -DisableIOAVProtection $true `
                             -DisableScriptScanning $true `
                             -DisableArchiveScanning $true `
                             -DisableIntrusionPreventionSystem $true `
                             -MAPSReporting Disabled `
                             -SubmitSamplesConsent NeverSend `
                             -ErrorAction Stop
            Write-Host "Defender protections disabled"
          } catch {
            Write-Warning "Set-MpPreference failed: $_"
          }
          Get-MpPreference | Select-Object DisableRealtimeMonitoring,DisableBehaviorMonitoring,DisableIOAVProtection,DisableScriptScanning

      - name: Build native helpers (Windows)
        shell: pwsh
        working-directory: desktop/native
        run: powershell -ExecutionPolicy Bypass -File build.ps1

      - name: Snapshot Defender threat detections
        if: always()
        shell: pwsh
        run: |
          try {
            $threats = Get-MpThreatDetection -ErrorAction SilentlyContinue
            if ($threats) {
              Write-Host "Defender threat detections during build:"
              $threats | Format-List Resources, ActionSuccess, AdditionalActionsBitMask, ThreatID, DetectionID
            } else {
              Write-Host "No Defender threat detections recorded."
            }
          } catch {
            Write-Host "Get-MpThreatDetection unavailable: $_"
          }

      - name: Stage and tar Windows artifacts
        shell: bash
        run: |
          set -euo pipefail
          OUT="desktop/native/out/win32"
          if [ ! -d "$OUT" ]; then
            echo "expected $OUT to exist after build" >&2
            exit 1
          fi
          echo "Contents of $OUT after build:"
          ls -la "$OUT"
          required=("window_info.exe" "window_text.exe" "selected_text.exe" "dictation_bridge.exe" "stella-computer-helper.exe" "wakeword_listener.exe")
          missing=0
          for name in "${required[@]}"; do
            if [ ! -f "$OUT/$name" ]; then
              echo "::error::Missing required Windows helper: $name" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          mkdir -p stage-win-x64
          cp -R "$OUT"/. stage-win-x64/
          tar --zstd -cf stella-native-win-x64.tar.zst -C stage-win-x64 .

      - name: Upload Windows x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: stella-native-win-x64
          path: stella-native-win-x64.tar.zst
          retention-days: 30

  desktop:
    needs:
      - native-macos
      - native-windows
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win-x64
          - os: macos-latest
            platform: darwin-arm64
          - os: macos-latest
            platform: darwin-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Need full repo (no sparse-checkout) so `git archive HEAD` below
          # captures every tracked file. The git object store is also what
          # the install-update agent's partial fetch later resolves against.
          fetch-depth: 1

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#desktop-v}" >> "$GITHUB_OUTPUT"
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install desktop dependencies
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun ./node_modules/electron/install.js

      - name: Download native helper artifact
        uses: actions/download-artifact@v4
        with:
          name: stella-native-${{ matrix.platform }}
          path: native-assets

      - name: Package release tarball
        shell: bash
        run: |
          rm -rf release-root
          mkdir release-root

          # Stream every git-tracked file at HEAD into release-root so the
          # working tree matches upstream's commit byte-for-byte. The
          # launcher then attaches real upstream history with `git fetch
          # --filter=blob:none origin <commit>` + `git reset --mixed
          # <commit>` and gets a clean working state with no synthetic
          # "deleted" entries. Hydrated dependencies and native helpers are
          # copied in after this source snapshot so first-run install does not
          # rebuild them on the user's machine.
          git archive HEAD | tar -x -C release-root/

          tar -cf - node_modules | tar -xf - -C release-root

          helper_platform_dir="$STELLA_NATIVE_HELPER_PLATFORM_DIR"
          helper_dir="release-root/desktop/native/out/${helper_platform_dir}"
          mkdir -p "$helper_dir"
          tar --zstd -xf "native-assets/stella-native-${{ matrix.platform }}.tar.zst" -C "$helper_dir"

          node - "$helper_dir" <<'NODE'
          const { writeFileSync } = require("node:fs");
          const { join } = require("node:path");

          const [helperDir] = process.argv.slice(2);
          const builtAt = new Date().toISOString();
          writeFileSync(
            join(helperDir, ".stella-native-helpers.json"),
            `${JSON.stringify({
              schemaVersion: 1,
              sourceManifestUrl: null,
              platform: process.env.STELLA_DESKTOP_PLATFORM,
              helperPlatformDir: process.env.STELLA_NATIVE_HELPER_PLATFORM_DIR,
              sha: `desktop-v${process.env.STELLA_DESKTOP_VERSION}`,
              commit: process.env.STELLA_DESKTOP_COMMIT,
              builtAt,
              installedAt: builtAt,
              bundled: true,
            }, null, 2)}\n`,
          );
          NODE

          mkdir -p release-root/state/outputs

          node <<'NODE'
          const { createHash } = require("node:crypto");
          const { readdirSync, statSync, readFileSync, writeFileSync } = require("node:fs");
          const { join, relative, sep } = require("node:path");

          const root = "release-root";
          const files = {};
          const excludedManifestPrefixes = ["node_modules/", "desktop/native/out/"];

          function walk(dir) {
            for (const entry of readdirSync(dir)) {
              const path = join(dir, entry);
              const stat = statSync(path);
              const rel = relative(root, path).split(sep).join("/");
              if (
                excludedManifestPrefixes.some((prefix) => rel === prefix.slice(0, -1) || rel.startsWith(prefix))
              ) {
                continue;
              }
              if (stat.isDirectory()) {
                walk(path);
                continue;
              }
              const bytes = readFileSync(path);
              files[rel] = {
                sha256: createHash("sha256").update(bytes).digest("hex"),
                size: stat.size,
              };
            }
          }

          walk(root);
          writeFileSync(
            join(root, "stella-release.json"),
            `${JSON.stringify({
              schemaVersion: 1,
              tag: `desktop-v${process.env.STELLA_DESKTOP_VERSION}`,
              version: process.env.STELLA_DESKTOP_VERSION,
              platform: process.env.STELLA_DESKTOP_PLATFORM,
              commit: process.env.STELLA_DESKTOP_COMMIT,
              bundledDependencies: true,
              bundledNativeHelpers: true,
              files,
            }, null, 2)}\n`,
          );
          NODE

          tar --zstd -cf "stella-desktop-${{ matrix.platform }}.tar.zst" -C release-root .
        env:
          STELLA_DESKTOP_VERSION: ${{ steps.version.outputs.version }}
          STELLA_DESKTOP_PLATFORM: ${{ matrix.platform }}
          STELLA_DESKTOP_COMMIT: ${{ github.sha }}
          STELLA_NATIVE_HELPER_PLATFORM_DIR: ${{ matrix.platform == 'win-x64' && 'win32' || 'darwin' }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: stella-desktop-${{ matrix.platform }}
          path: stella-desktop-${{ matrix.platform }}.tar.zst
          retention-days: 30

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - desktop
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: stella-*
          merge-multiple: true

      - name: Publish desktop payloads to R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_PUBLIC_BASE_URL: https://pub-a319aaada8144dc9be5a83625033769c.r2.dev
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          release_dir="desktop/releases/${tag}"
          manifest_path="$(mktemp)"

          node - "$manifest_path" "$tag" "$GITHUB_SHA" "$R2_PUBLIC_BASE_URL" release-assets/stella-desktop-*.tar.zst <<'NODE'
          const { createHash } = require("node:crypto");
          const { readFileSync, statSync, writeFileSync } = require("node:fs");
          const { basename } = require("node:path");

          const [manifestPath, tag, commit, publicBaseUrl, ...archivePaths] = process.argv.slice(2);
          const assets = {};
          for (const archivePath of archivePaths) {
            const name = basename(archivePath);
            const match = name.match(/^stella-desktop-(.+)\.tar\.zst$/);
            if (!match) continue;
            const platform = match[1];
            const bytes = readFileSync(archivePath);
            assets[platform] = {
              url: `${publicBaseUrl.replace(/\/$/, "")}/desktop/releases/${tag}/${name}`,
              sha256: createHash("sha256").update(bytes).digest("hex"),
              size: statSync(archivePath).size,
            };
          }
          writeFileSync(
            manifestPath,
            `${JSON.stringify({
              schemaVersion: 1,
              tag,
              commit,
              assets,
              publishedAt: new Date().toISOString(),
            }, null, 2)}\n`,
          );
          NODE

          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION="auto"

          aws s3 cp "release-assets/" "s3://${R2_BUCKET}/${release_dir}/" \
            --recursive \
            --exclude "*" \
            --include "stella-desktop-*.tar.zst" \
            --endpoint-url "$R2_ENDPOINT"
          aws s3 cp "$manifest_path" "s3://${R2_BUCKET}/${release_dir}/manifest.json" \
            --content-type "application/json" \
            --cache-control "public, max-age=31536000, immutable" \
            --endpoint-url "$R2_ENDPOINT"

          native_manifest_path="$(mktemp)"
          node - "$native_manifest_path" "$tag" "$GITHUB_SHA" "$R2_PUBLIC_BASE_URL" release-assets/stella-native-*.tar.zst <<'NODE'
          const { createHash } = require("node:crypto");
          const { readFileSync, statSync, writeFileSync } = require("node:fs");
          const { basename } = require("node:path");

          const [manifestPath, tag, commit, publicBaseUrl, ...archivePaths] = process.argv.slice(2);
          const assets = {};
          const expected = new Set(["darwin-arm64", "darwin-x64", "win-x64"]);

          for (const archivePath of archivePaths) {
            const name = basename(archivePath);
            const match = name.match(/^stella-native-(.+)\.tar\.zst$/);
            if (!match) continue;
            const platform = match[1];
            if (!expected.has(platform)) {
              throw new Error(`Unexpected native helpers asset: ${name}`);
            }
            const bytes = readFileSync(archivePath);
            assets[platform] = {
              url: `${publicBaseUrl.replace(/\/$/, "")}/native-helpers/${tag}/${name}`,
              sha256: createHash("sha256").update(bytes).digest("hex"),
              size: statSync(archivePath).size,
            };
          }
          for (const platform of expected) {
            if (!assets[platform]) {
              throw new Error(`Missing native helpers asset for ${platform}`);
            }
          }
          writeFileSync(
            manifestPath,
            `${JSON.stringify({
              schemaVersion: 1,
              sha: tag,
              commit,
              builtAt: new Date().toISOString(),
              assets,
            }, null, 2)}\n`,
          );
          NODE

          aws s3 cp "release-assets/" "s3://${R2_BUCKET}/native-helpers/${tag}/" \
            --recursive \
            --exclude "*" \
            --include "stella-native-*.tar.zst" \
            --endpoint-url "$R2_ENDPOINT"
          aws s3 cp "$native_manifest_path" "s3://${R2_BUCKET}/native-helpers/${tag}/manifest.json" \
            --content-type "application/json" \
            --cache-control "public, max-age=31536000, immutable" \
            --endpoint-url "$R2_ENDPOINT"
          aws s3 cp "$native_manifest_path" "s3://${R2_BUCKET}/native-helpers/current.json" \
            --content-type "application/json" \
            --cache-control "no-cache" \
            --endpoint-url "$R2_ENDPOINT"

          aws s3 cp "$manifest_path" "s3://${R2_BUCKET}/desktop/current.json" \
            --content-type "application/json" \
            --cache-control "no-cache" \
            --endpoint-url "$R2_ENDPOINT"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"

          shopt -s nullglob
          files=(release-assets/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No release assets found"
            exit 1
          fi

          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" "${files[@]}" \
              --title "$tag" \
              --generate-notes
          else
            gh release upload "$tag" "${files[@]}" --clobber
          fi

      - name: Notify Convex of new desktop release
        env:
          CONVEX_SITE_URL: ${{ secrets.CONVEX_SITE_URL }}
          DESKTOP_RELEASE_PUBLISH_SECRET: ${{ secrets.DESKTOP_RELEASE_PUBLISH_SECRET }}
          R2_PUBLIC_BASE_URL: https://pub-a319aaada8144dc9be5a83625033769c.r2.dev
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${CONVEX_SITE_URL:-}" ] || [ -z "${DESKTOP_RELEASE_PUBLISH_SECRET:-}" ]; then
            echo "CONVEX_SITE_URL or DESKTOP_RELEASE_PUBLISH_SECRET is not set; skipping Convex notify."
            exit 0
          fi

          tag="${GITHUB_REF_NAME}"
          payload_path="$(mktemp)"

          node - "$payload_path" "$tag" "$GITHUB_SHA" "$R2_PUBLIC_BASE_URL" release-assets/stella-desktop-*.tar.zst <<'NODE'
          const { createHash } = require("node:crypto");
          const { readFileSync, statSync, writeFileSync } = require("node:fs");
          const { basename } = require("node:path");

          const [payloadPath, tag, commit, publicBaseUrl, ...archivePaths] = process.argv.slice(2);
          const assets = {};
          for (const archivePath of archivePaths) {
            const name = basename(archivePath);
            const match = name.match(/^stella-desktop-(.+)\.tar\.zst$/);
            if (!match) continue;
            const platform = match[1];
            const bytes = readFileSync(archivePath);
            assets[platform] = {
              url: `${publicBaseUrl.replace(/\/$/, "")}/desktop/releases/${tag}/${name}`,
              sha256: createHash("sha256").update(bytes).digest("hex"),
              size: statSync(archivePath).size,
            };
          }
          writeFileSync(
            payloadPath,
            JSON.stringify({
              tag,
              commit,
              publishedAt: new Date().toISOString(),
              assets,
            }),
          );
          NODE

          curl --fail-with-body --show-error --silent \
            -X POST "${CONVEX_SITE_URL%/}/api/desktop-releases/publish" \
            -H "Authorization: Bearer ${DESKTOP_RELEASE_PUBLISH_SECRET}" \
            -H "Content-Type: application/json" \
            --data-binary "@${payload_path}"
