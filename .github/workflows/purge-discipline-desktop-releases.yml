name: Purge Contaminated Desktop Releases

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Delete affected R2 release objects
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          set -euo pipefail
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"

          for version in $(seq 364 448); do
            aws s3 rm \
              "s3://${R2_BUCKET}/desktop/releases/desktop-v0.0.${version}/" \
              --recursive \
              --endpoint-url "$R2_ENDPOINT"
          done

          aws s3 rm \
            "s3://${R2_BUCKET}/desktop/current.json" \
            --endpoint-url "$R2_ENDPOINT"
